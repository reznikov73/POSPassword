[package]
name = "vault-win"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
vault-core = { path = "../../crates/vault-core" }
eframe = "0.37"
arboard = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"
