[package]
name = "vault-win"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
vault-core = { path = "../../crates/vault-core" }
eframe = "0.37"
arboard = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
