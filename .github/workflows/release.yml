# Релиз: сборка пакета и установщика по тегу v*.
#
# Артефакты: dist/Hranitel-<версия>-win64.zip и setup.exe.
# Публикация релиза с вложениями — если тег называется как релиз.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Пакет и установщик
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Установить Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Собрать пакет
        shell: pwsh
        run: pwsh -File scripts/package.ps1

      - name: Собрать установщик
        shell: pwsh
        run: pwsh -File scripts/build-installer.ps1
        env:
          # ISCC из choco доступен в PATH после refreshenv; на всякий случай
          # указываем типичное место напрямую.
          PATH: '${{ env.PATH }};C:\Program Files (x86)\Inno Setup 6'

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          "version=$tag" >> $env:GITHUB_OUTPUT

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Hranitel-${{ steps.ver.outputs.version }}-win64
          path: |
            dist/Hranitel-*-win64.zip
            dist/Hranitel-*-setup.exe
          if-no-files-found: error

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Hranitel-*-win64.zip
            dist/Hranitel-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
